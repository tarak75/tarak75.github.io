<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход в аккаунт</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body class="auth-page">
    <div class="auth-wrapper">
        <a href="index.html" class="back-link">← Назад на главную</a>

        <div class="auth-card">
            <h1>Вход в аккаунт</h1>
            <p class="auth-subtitle">Добро пожаловать обратно!</p>

            <form id="loginForm" class="auth-form">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="example@mail.com" required>

                <label for="loginPassword">Пароль</label>
                <div class="password-wrap">
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" data-target="loginPassword">👁</button>
                </div>

                <div class="auth-row">
                    <label class="checkbox-wrap">
                        <input type="checkbox" id="rememberMe">
                        <span>Запомнить меня</span>
                    </label>

                    <button type="button" class="text-btn" id="forgotPasswordBtn">Забыли пароль?</button>
                </div>

                <button type="submit" class="btn btn-primary btn-full">Войти</button>

                <p class="auth-switch">
                    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                </p>

                <div class="divider"><span>Или продолжить с</span></div>

                <div class="social-auth">
                    <button type="button" class="social-login">Google</button>
                    <button type="button" class="social-login">yandex</button>
                </div>

                <p class="form-message" id="loginMessage"></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
